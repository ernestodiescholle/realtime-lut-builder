[package]
name = "lut-generator"
version = "1.0.0"
description = "LUT Generator für die LUMIX S9"
edition = "2021"

[lib]
name = "lut_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
